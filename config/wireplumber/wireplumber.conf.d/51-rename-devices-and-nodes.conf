monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_04_00.1.hdmi-stereo"
      }
    ]
    actions = {
      update-props = {
        node.description = "HDMI"
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_output.usb-C-Media_Electronics_Inc._USB_Audio_Device-00.analog-stereo"
      }
    ]
    actions = {
      update-props = {
        node.description = "Headset"
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_04_00.6.analog-stereo"
      }
    ]
    actions = {
      update-props = {
        node.description = "Intern"
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_input.usb-EMEET_eMeet_Nova_SN0005-02.analog-stereo"
      }
    ]
    actions = {
      update-props = {
        node.description = "Webcam eMeet"
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_input.usb-C-Media_Electronics_Inc._USB_Audio_Device-00.mono-fallback"
      }
    ]
    actions = {
      update-props = {
        node.description = "Headset"
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_input.pci-0000_04_00.6.analog-stereo"
      }
    ]
    actions = {
      update-props = {
        node.description = "Intern"
      }
    }
  }
  {
    matches = [
      {
        device.name = "alsa_card.usb-C-Media_Electronics_Inc._USB_Audio_Device-00"
      }
    ]
    actions = {
      update-props = {
        device.description = "Headset"
      }
    }
  }
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_04_00.1"
      }
    ]
    actions = {
      update-props = {
        device.description = "HDMI"
      }
    }
  }
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_04_00.6"
      }
    ]
    actions = {
      update-props = {
        device.description = "Intern"
      }
    }
  }
  {
    matches = [
      {
        device.name = "alsa_card.usb-EMEET_eMeet_Nova_SN0005-02"
      }
    ]
    actions = {
      update-props = {
        device.description = "Webcam eMeet"
      }
    }
  }
]
